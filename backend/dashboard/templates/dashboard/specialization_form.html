{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="layout-page">
  <div class="content-wrapper">
    <div class="container-xxl flex-grow-1 container-p-y">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h4 class="fw-bold mb-0">{{ page_title }}</h4>
        <a href="{% url 'specializations' %}" class="btn btn-outline-secondary btn-sm"><i class="bx bx-left-arrow-alt"></i> Back</a>
      </div>

      {% if errors %}
      <div class="alert alert-danger">
        <ul class="mb-0">
          {% for err in errors %}
          <li>{{ err }}</li>
          {% endfor %}
        </ul>
      </div>
      {% endif %}

      <div class="card mb-4">
        <div class="card-body">
          <form method="POST" novalidate>
            {% csrf_token %}
            <div class="row g-3">
              <div class="col-md-4">
                <label for="code" class="form-label">Code</label>
                <input id="code" name="code" type="text" class="form-control" value="{{ form.code }}" placeholder="e.g. INFO" required />
              </div>
              <div class="col-md-8">
                <label for="name" class="form-label">Name</label>
                <input id="name" name="name" type="text" class="form-control" value="{{ form.name }}" placeholder="e.g. Informatique" required />
              </div>
              <div class="col-md-6 d-flex align-items-end">
                <div class="form-check form-switch mb-2">
                  <input id="is_active" name="is_active" type="checkbox" class="form-check-input" {% if form.is_active %}checked{% endif %}>
                  <label class="form-check-label" for="is_active">Specialization is active</label>
                </div>
              </div>
              <div class="col-md-12 text-end">
                <button type="submit" class="btn btn-primary">{{ submit_label }}</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
