{% extends 'base.html' %}
{% load static %}
{% block content %}
<div class="layout-page">
  <div class="content-wrapper">
    <div class="container-xxl flex-grow-1 container-p-y">
      <div class="page-header mb-4">
        <h4 class="fw-bold mb-0">{{ page_title|default:'Add Student' }}</h4>
        <a href="{% url 'students' %}" class="btn btn-outline-secondary btn-sm"><i class="bx bx-left-arrow-alt"></i> Back</a>
      </div>

      {% if errors %}
      <div class="alert alert-danger">
        <ul class="mb-0">
          {% for err in errors %}
          <li>{{ err }}</li>
          {% endfor %}
        </ul>
      </div>
      {% endif %}

      <div class="card mb-4">
        <div class="card-body">
          <form method="POST" novalidate>
            {% csrf_token %}
            <div class="row g-3">
              <div class="col-md-6">
                <label for="name" class="form-label">Name</label>
                <input id="name" name="name" type="text" class="form-control" value="{{ form.name }}" required />
              </div>
              <div class="col-md-6">
                <label for="email" class="form-label">Email</label>
                <input id="email" name="email" type="email" class="form-control" value="{{ form.email }}" required />
              </div>
              <div class="col-md-4">
                <label for="specialization" class="form-label">Specialization</label>
                <select id="specialization" name="specialization" class="form-select" required>
                  <option value="">Pick</option>
                  {% for value, label in specialization_options %}
                  <option value="{{ value }}" {% if form.specialization == value %}selected{% endif %}>{{ label }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-4">
                <label for="year" class="form-label">Level</label>
                <select id="year" name="year" class="form-select" required>
                  <option value="">Pick</option>
                  {% for value, label in year_options %}
                  <option value="{{ value }}" {% if form.year == value %}selected{% endif %}>{{ label }}</option>
                  {% endfor %}
                </select>
              </div>
              <div class="col-md-4">
                <label for="phone_number" class="form-label">Phone Number (Optional)</label>
                <input id="phone_number" name="phone_number" type="text" class="form-control" value="{{ form.phone_number }}" placeholder="e.g. +213 555 12 34 56" />
              </div>
              <div class="col-md-4">
                <label for="student_card_id" class="form-label">Student Card ID</label>
                <input id="student_card_id" name="student_card_id" type="text" class="form-control" value="{{ form.student_card_id }}" required />
              </div>
              <div class="col-md-6">
                <label for="rfid_number" class="form-label">RFID Number</label>
                <input id="rfid_number" name="rfid_number" type="text" class="form-control" value="{{ form.rfid_number }}" required />
              </div>
              <div class="col-md-6 d-flex align-items-end">
                <div class="form-check form-switch mb-2">
                  <input id="is_active" name="is_active" type="checkbox" class="form-check-input" {% if form.is_active %}checked{% endif %} />
                  <label class="form-check-label" for="is_active">Student is active</label>
                </div>
              </div>

              <div class="col-md-12 text-end">
                <button type="submit" class="btn btn-primary">{{ submit_label|default:'Create Student' }}</button>
              </div>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
