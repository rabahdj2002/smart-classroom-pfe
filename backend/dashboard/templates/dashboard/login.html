<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | {{ app_settings.platform_name|default:"HeisenHelmet" }}</title>
    <style>
        :root {
            --primary: oklch(0.6 0.25 260); /* Electric Blue */
            --secondary: oklch(0.65 0.3 330); /* Protection Violet */
            --safety-orange: oklch(0.7 0.2 45); /* Alert/Visibility Orange */
            --glass: rgba(255, 255, 255, 0.08);
            --bg: #030712;
        }

        body {
            margin: 0;
            font-family: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Animated Abstract Background */
        .bg-glow {
            position: absolute;
            width: 100vw;
            height: 100vh;
            background: 
                radial-gradient(circle at 20% 30%, oklch(0.4 0.2 260 / 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, oklch(0.4 0.2 330 / 0.15) 0%, transparent 50%);
            z-index: -1;
        }

        /* The Protection Shield (Animated Orbitals) */
        .shield-orb {
            position: absolute;
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 50%;
            animation: rotate 20s linear infinite;
        }

        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        .auth-card {
            background: rgba(17, 24, 39, 0.7);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 3rem;
            width: 100%;
            max-width: 440px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
            z-index: 10;
        }

        .logo-box {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            box-shadow: 0 0 30px oklch(0.6 0.25 260 / 0.4);
        }

        h1 { font-size: 1.75rem; font-weight: 800; margin: 0; text-align: center; letter-spacing: -0.02em; }
        p.subtitle { text-align: center; color: rgba(255,255,255,0.5); margin-top: 0.5rem; font-size: 0.95rem; }

        .input-group { margin-top: 2rem; position: relative; }
        label { display: block; font-size: 0.8rem; font-weight: 600; text-transform: uppercase; color: rgba(255,255,255,0.4); margin-bottom: 0.6rem; letter-spacing: 0.05em; }
        
        input {
            width: 100%;
            background: rgba(0,0,0,0.2);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 12px;
            padding: 1rem;
            color: white;
            font-size: 1rem;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(0,0,0,0.4);
            box-shadow: 0 0 0 4px oklch(0.6 0.25 260 / 0.1);
        }

        .login-btn {
            width: 100%;
            margin-top: 2rem;
            padding: 1rem;
            border-radius: 12px;
            border: none;
            background: white;
            color: black;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
        }

        .login-btn:hover { background: #f3f4f6; transform: translateY(-1px); }
        .login-btn:active { transform: translateY(0px); }

        .integrity-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 2rem;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.3);
        }
        
        .error-msg {
            background: oklch(0.4 0.2 25 / 0.2);
            border: 1px solid oklch(0.4 0.2 25);
            color: oklch(0.8 0.1 25);
            padding: 0.75rem;
            border-radius: 10px;
            margin-top: 1rem;
            font-size: 0.85rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="bg-glow"></div>
    <div class="shield-orb" style="width: 600px; height: 600px; top: -100px; right: -100px;"></div>
    <div class="shield-orb" style="width: 400px; height: 400px; bottom: -50px; left: -50px; animation-duration: 30s;"></div>

    <div class="auth-card">
        <div class="logo-box">
            <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" style="width: 32px; height: 32px;">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
            </svg>
        </div>
        <h1>{{ app_settings.platform_name|default:"HeisenHelmet" }}</h1>
        <p class="subtitle">IoT Safety & Fleet Integrity Platform</p>

        <form method="POST">
            {% csrf_token %}
            {% if form.errors %}
            <div class="error-msg">Verification failed. Check credentials.</div>
            {% endif %}

            <div class="input-group">
                <label>Identifier</label>
                <input type="text" name="username" placeholder="Username or Email" required>
            </div>

            <div class="input-group">
                <label>Security Key</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="login-btn">Secure Login</button>
        </form>

        <div class="integrity-badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width: 14px; height: 14px;">
                <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
            </svg>
            Encrypted End-to-End Safety Protocol
        </div>
    </div>
</body>
</html>
